<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#111628"/>
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e284a"/>
      <stop offset="100%" stop-color="#141a32"/>
    </linearGradient>

    <!-- Keycap Active Gradient -->
    <linearGradient id="activeKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Lens Left Glow -->
    <radialGradient id="lensLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Lens Right Glow -->
    <radialGradient id="lensRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Keycaps -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="4"/>

  <!-- Main Rounded Hexagon Badge -->
  <path d="
    M 240,64
    Q 256,54 272,64
    L 416,146
    Q 432,156 432,174
    L 432,338
    Q 432,356 416,366
    L 272,448
    Q 256,458 240,448
    L 96,366
    Q 80,356 80,338
    L 80,174
    Q 80,156 96,146
    Z
  " fill="#12182b" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Hexagon Thin Accent Line -->
  <path d="
    M 243,88
    Q 256,80 269,88
    L 396,160
    Q 408,168 408,182
    L 408,330
    Q 408,344 396,352
    L 269,424
    Q 256,432 243,424
    L 116,352
    Q 104,344 104,330
    L 104,182
    Q 104,168 116,160
    Z
  " fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35"/>

  <!-- VR Headset Body Shell -->
  <rect x="120" y="116" width="272" height="102" rx="50" fill="url(#visorGrad)" stroke="#38bdf8" stroke-width="4"/>

  <!-- Visor Dark Mirror Lens Area -->
  <rect x="132" y="126" width="248" height="82" rx="40" fill="#0b0f1d" stroke="#1e293b" stroke-width="2"/>

  <!-- Left VR Optical Chamber -->
  <circle cx="198" cy="167" r="33" fill="url(#lensLeft)" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="198" cy="167" r="11" fill="#38bdf8"/>
  <path d="M 174,152 Q 198,140 222,152" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Right VR Optical Chamber -->
  <circle cx="314" cy="167" r="33" fill="url(#lensRight)" stroke="#34d399" stroke-width="3"/>
  <circle cx="314" cy="167" r="11" fill="#34d399"/>
  <path d="M 290,152 Q 314,140 338,152" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Center Tracking Sensor Point -->
  <circle cx="256" cy="136" r="4" fill="#ffffff" fill-opacity="0.8"/>

  <!-- Left/Right Mechanical Strap Hinges -->
  <rect x="106" y="156" width="14" height="22" rx="5" fill="#222f4e" stroke="#38bdf8" stroke-width="2"/>
  <rect x="392" y="156" width="14" height="22" rx="5" fill="#222f4e" stroke="#38bdf8" stroke-width="2"/>

  <!-- 3D Floating Keyboard Keys -->
  <!-- Row 1 -->
  <rect x="150" y="254" width="46" height="48" rx="12" fill="#1a233a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
  <rect x="206" y="250" width="46" height="52" rx="12" fill="url(#activeKeyGrad)" stroke="#ffffff" stroke-width="3"/>
  <path d="M 218,264 L 240,264 M 229,264 L 229,288" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="254" width="46" height="48" rx="12" fill="#1a233a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
  <rect x="318" y="254" width="46" height="48" rx="12" fill="#1a233a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Row 2 -->
  <rect x="164" y="316" width="56" height="48" rx="12" fill="#1a233a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
  <rect x="228" y="316" width="56" height="48" rx="12" fill="#1a233a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>
  <rect x="292" y="316" width="56" height="48" rx="12" fill="#1a233a" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Row 3 (Spacebar) -->
  <rect x="164" y="378" width="184" height="38" rx="12" fill="#161e33" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.85"/>
</svg>